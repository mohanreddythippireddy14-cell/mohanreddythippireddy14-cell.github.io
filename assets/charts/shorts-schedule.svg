<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Upload schedule" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
<rect width="760" height="230" rx="16" fill="#ffffff"/>
